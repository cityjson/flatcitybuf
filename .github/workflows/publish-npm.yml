name: Publish NPM Package

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GA_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions[bot]@github.com"

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Build WASM package
        run: ./scripts/build_wasm.sh

      - name: Bump version
        id: bump
        run: |
          cd src/ts
          # package.json is the single source of the npm name, version and
          # metadata. It is edited in place -- never regenerated here, so
          # the workflow cannot drift from what is committed.
          npm version ${{ github.event.inputs.version_bump }} --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify the package contains only what it should
        run: |
          cd src/ts
          # Fails the run rather than publishing a package missing its wasm.
          for f in fcb_wasm_bg.wasm fcb_wasm.js fcb_wasm.d.ts; do
            [[ -s "$f" ]] || { echo "missing or empty: $f"; exit 1; }
          done
          npm pack --dry-run

      - name: Publish to NPM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd src/ts
          npm publish --access public

      - name: Commit the version bump
        run: |
          # Only package.json moves. The build output is gitignored, so
          # there is nothing generated left to commit.
          git add src/ts/package.json
          git commit -m "chore: release npm v${{ steps.bump.outputs.version }}"
          git tag "npm-v${{ steps.bump.outputs.version }}"
          git push
          git push --tags
