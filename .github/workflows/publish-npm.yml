name: Publish NPM Package

# Publishes the pure TypeScript reader at src/ts to npm.
#
# Dispatch-only, mirroring publish-python.yml and publish-crate.yml: pick a
# bump type and the workflow edits the committed package.json in place (the
# single source of the npm name, version and metadata), publishes, then
# commits the bump and tags `npm-v<version>`. There deliberately is NO tag
# trigger: the tag pushed below uses the GA_TOKEN PAT, whose pushes DO
# trigger workflows, so a tag trigger here would re-run this workflow and
# attempt a second publish of the same version.
#
# There is no wasm build here -- no wasm-pack, no wasm32-unknown-unknown
# target, no artifact copying -- because the package is plain TypeScript
# compiled by `npm run build`.

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ts
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GA_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions[bot]@github.com"

      - name: Install dependencies
        run: npm ci

      # Build BEFORE typecheck: the examples resolve @cityjson/flatcitybuf
      # through the package self-reference into dist/, absent on a fresh
      # checkout (same ordering constraint as `just check` in src/ts). The
      # build output embeds no version, so building before the bump is fine —
      # npm publish reads the version from package.json at pack time.
      - name: Build the package
        run: npm run build

      - name: Typecheck and test before publishing
        # ci-ts.yml gates the source on every push, but a dispatch can run on
        # any commit; re-running the checks here makes it impossible to publish
        # a package whose behaviour regressed. The Node suite is ~2s.
        run: |
          npm run typecheck
          npx vitest run

      - name: Bump version
        id: bump
        env:
          BUMP: ${{ inputs.version_bump }}
        run: |
          # Edits package.json (and the version field of package-lock.json) in
          # place -- never regenerated here, so the workflow cannot drift from
          # what is committed. No tag yet: publish must succeed first.
          VERSION="$(npm version "$BUMP" --no-git-tag-version)"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Verify the artifact before publishing
        run: |
          # Inspect exactly what would be published. `files` in package.json
          # restricts the tarball to `dist`, so this must list the built
          # dist/*.js and dist/*.d.ts and nothing from src or test.
          npm pack --dry-run
          # The entry points named in package.json `exports` must exist in the
          # build output, or consumers get an unresolvable import.
          for f in dist/index.js dist/index.d.ts dist/io/node.js dist/io/node.d.ts; do
            [[ -s "$f" ]] || { echo "missing or empty build output: $f"; exit 1; }
          done

      - name: Publish to NPM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Commit the version bump
        run: |
          # Only the manifests move. dist/ is build output, not tracked.
          git add package.json package-lock.json
          git commit -m "chore: release npm v${{ steps.bump.outputs.version }}"
          git tag "npm-v${{ steps.bump.outputs.version }}"
          git push
          git push --tags
