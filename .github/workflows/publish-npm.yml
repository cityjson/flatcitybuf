name: Publish NPM Package

# Publishes the pure TypeScript reader at src/ts to npm.
#
# The version is read from src/ts/package.json ONLY -- the single committed
# source of the npm name, version and metadata. This workflow never bumps or
# regenerates it: to release, commit a version bump to package.json and push a
# matching `npm-v<version>` tag (or trigger the workflow manually). There is no
# wasm build here -- no wasm-pack, no wasm32-unknown-unknown target, no artifact
# copying -- because the package is plain TypeScript compiled by `npm run build`.

on:
  push:
    tags:
      - "npm-v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ts
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build the package
        run: npm run build

      - name: Verify the artifact before publishing
        run: |
          # Inspect exactly what would be published. `files` in package.json
          # restricts the tarball to `dist`, so this must list the built
          # dist/*.js and dist/*.d.ts and nothing from src or test.
          npm pack --dry-run
          # The entry points named in package.json `exports` must exist in the
          # build output, or consumers get an unresolvable import.
          for f in dist/index.js dist/index.d.ts dist/io/node.js dist/io/node.d.ts; do
            [[ -s "$f" ]] || { echo "missing or empty build output: $f"; exit 1; }
          done

      - name: Publish to NPM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
