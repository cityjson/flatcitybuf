name: Publish Crate

# Publishes fcb_core, then fcb_cli and fcb_api, to crates.io at one shared
# version. fcb_api is the axum server; deploy-api.yml deploys it separately.
#
# A crate whose current version is already on crates.io is skipped, so a run
# that failed half-way can be finished, and `none` publishes whatever is not
# out yet at the version in the tree, with no version commit and no tag.

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - none

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GA_TOKEN }}
          fetch-depth: 0

      # actions-rs/* was archived by its maintainer and warns on every run;
      # dtolnay/rust-toolchain is the maintained replacement and is what the
      # CI workflows already use.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install just task runner
        uses: taiki-e/install-action@v2.90.6
        with:
          tool: just

      - name: Install nextest
        uses: taiki-e/install-action@v2.90.6
        with:
          tool: nextest

      # A tag or manual dispatch can land on any commit, so re-run the gate
      # here rather than trusting that CI happened to pass on this SHA. This
      # mirrors what publish-npm.yml already does, and is what stops a
      # regression from reaching crates.io -- where versions cannot be
      # replaced, only yanked.
      - name: Verify before publishing
        working-directory: src/rust
        run: just check

      - name: Install cargo-workspaces
        run: cargo install cargo-workspaces

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions[bot]@github.com"

      - name: Bump version
        if: github.event.inputs.version_bump != 'none'
        working-directory: src/rust
        run: |
          # `just check` above runs for many minutes, so the branch may have
          # moved since checkout. cargo-workspaces commits AND pushes
          # internally, and a non-fast-forward push aborts the whole release
          # -- re-sync first to shrink that race to the seconds between this
          # rebase and its push. Discard any tracked files the check step
          # modified first, or the rebase refuses on a dirty tree.
          git checkout -- :/
          git pull --rebase
          cargo workspaces version --all --yes --force="fcb*" \
            --no-individual-tags ${{ github.event.inputs.version_bump }}

      - name: Configure cargo for publishing
        run: |
          mkdir -p ~/.cargo
          echo "[net]" >> ~/.cargo/config.toml
          echo "git-fetch-with-cli = true" >> ~/.cargo/config.toml

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        working-directory: src/rust
        run: |
          # $1 is the crate's directory, $2 its name. --allow-dirty is
          # required because the version bump above leaves the tree modified.
          published() {
            curl -sSf "https://crates.io/api/v1/crates/$1/$2" \
              -H "User-Agent: flatcitybuf-ci" > /dev/null 2>&1
          }
          publish() {
            if published "$2" "$VERSION"; then
              echo "$2 $VERSION is already on crates.io, skipping"
            else
              (cd "$1" && cargo publish --allow-dirty)
            fi
          }

          VERSION=$(grep "^version" fcb_core/Cargo.toml | head -1 | cut -d'"' -f2)

          # fcb_core first: fcb_cli and fcb_api depend on it, and crates.io
          # must have indexed the new version before a dependent can resolve
          # it. Neither dependent depends on the other.
          publish fcb_core fcb_core

          # Poll the index instead of sleeping a fixed 30s, which was a guess
          # that either wasted time or was not long enough.
          for i in $(seq 1 60); do
            if published fcb_core "$VERSION"; then
              echo "fcb_core ${VERSION} is indexed"
              break
            fi
            echo "waiting for crates.io to index fcb_core ${VERSION} ($i/60)"
            sleep 5
          done

          publish cli fcb_cli
          publish fcb_api fcb_api
