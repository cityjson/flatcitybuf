name: Publish Crate

# Publishes fcb_core then fcb_cli to crates.io. fcb_api is a workspace member
# but is not published (it is the axum server, deployed by deploy-api.yml).

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GA_TOKEN }}
          fetch-depth: 0

      # actions-rs/* was archived by its maintainer and warns on every run;
      # dtolnay/rust-toolchain is the maintained replacement and is what the
      # CI workflows already use.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install just task runner
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: just

      - name: Install nextest
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: nextest

      # A tag or manual dispatch can land on any commit, so re-run the gate
      # here rather than trusting that CI happened to pass on this SHA. This
      # mirrors what publish-npm.yml already does, and is what stops a
      # regression from reaching crates.io -- where versions cannot be
      # replaced, only yanked.
      - name: Verify before publishing
        working-directory: src/rust
        run: just check

      - name: Install cargo-workspaces
        run: cargo install cargo-workspaces

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions[bot]@github.com"

      - name: Bump version
        working-directory: src/rust
        run: |
          # `just check` above runs for many minutes, so the branch may have
          # moved since checkout. cargo-workspaces commits AND pushes
          # internally, and a non-fast-forward push aborts the whole release
          # -- re-sync first to shrink that race to the seconds between this
          # rebase and its push. Discard any tracked files the check step
          # modified first, or the rebase refuses on a dirty tree.
          git checkout -- :/
          git pull --rebase
          cargo workspaces version --all --yes --force="fcb*" \
            --no-individual-tags ${{ github.event.inputs.version_bump }}

      - name: Configure cargo for publishing
        run: |
          mkdir -p ~/.cargo
          echo "[net]" >> ~/.cargo/config.toml
          echo "git-fetch-with-cli = true" >> ~/.cargo/config.toml

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        working-directory: src/rust
        run: |
          # fcb_core first: fcb_cli depends on it, and crates.io must have
          # indexed the new version before the dependent can resolve it.
          # --allow-dirty is required because the version bump above leaves
          # the tree modified.
          (cd fcb_core && cargo publish --allow-dirty)

          # Poll the index instead of sleeping a fixed 30s, which was a guess
          # that either wasted time or was not long enough.
          VERSION=$(grep "^version" fcb_core/Cargo.toml | head -1 | cut -d'"' -f2)
          for i in $(seq 1 60); do
            if curl -sSf "https://crates.io/api/v1/crates/fcb_core/${VERSION}" \
                 -H "User-Agent: flatcitybuf-ci" > /dev/null 2>&1; then
              echo "fcb_core ${VERSION} is indexed"
              break
            fi
            echo "waiting for crates.io to index fcb_core ${VERSION} ($i/60)"
            sleep 5
          done

          (cd cli && cargo publish --allow-dirty)
