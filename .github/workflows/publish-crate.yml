name: Publish Crate

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GA_TOKEN }}
          fetch-depth: 0

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install cargo-workspaces
        run: cargo install cargo-workspaces

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions[bot]@github.com"

      - name: Bump version
        run: |
          cd src/rust
          cargo workspaces version --all --yes --force="fcb*" ${{ github.event.inputs.version_bump }}

      - name: Configure cargo for publishing
        run: |
          mkdir -p ~/.cargo
          echo "[net]" >> ~/.cargo/config.toml
          echo "git-fetch-with-cli = true" >> ~/.cargo/config.toml

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cd src/rust
          # Publish fcb_core first since fcb_cli depends on it
          cd fcb_core
          cargo publish --allow-dirty
          cd ..
          # Wait a bit for crates.io to index the new version
          sleep 30
          # Now publish fcb_cli
          cd cli
          cargo publish --allow-dirty
