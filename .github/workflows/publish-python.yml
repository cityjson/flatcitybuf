name: Publish Python Package

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GA_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions[bot]@github.com"

      - name: Install just task runner
        uses: taiki-e/install-action@just

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      # A manual dispatch can land on any commit, so re-run the gate here
      # rather than trusting that CI happened to pass on this SHA. `just
      # check` covers ruff, mypy --strict and pytest in BOTH the numpy and
      # numpy-less states. PyPI versions cannot be replaced once uploaded,
      # only yanked. publish-npm.yml has always done this; this workflow
      # published without running a single test.
      - name: Verify before publishing
        working-directory: src/py
        run: just check

      - name: Install build tooling
        run: pip install build twine

      - name: Bump version
        id: bump
        working-directory: src/py
        env:
          BUMP: ${{ github.event.inputs.version_bump }}
        run: |
          # pyproject.toml is the single source of the package name, version
          # and metadata. It is edited in place -- never regenerated here,
          # so the workflow cannot drift from what is committed.
          python - <<'PY'
          import os
          import pathlib
          import re

          path = pathlib.Path("pyproject.toml")
          text = path.read_text()
          match = re.search(r'(?m)^version = "(\d+)\.(\d+)\.(\d+)"$', text)
          if match is None:
              raise SystemExit('could not find version = "X.Y.Z" in pyproject.toml')

          major, minor, patch = (int(part) for part in match.groups())
          bump = os.environ["BUMP"]
          if bump == "major":
              major, minor, patch = major + 1, 0, 0
          elif bump == "minor":
              minor, patch = minor + 1, 0
          elif bump == "patch":
              patch += 1
          else:
              raise SystemExit(f"invalid bump type: {bump}")

          new_version = f"{major}.{minor}.{patch}"
          new_text = (
              text[: match.start()] + f'version = "{new_version}"' + text[match.end() :]
          )
          path.write_text(new_text)

          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"version={new_version}\n")
          PY

      - name: Build the wheel and sdist
        working-directory: src/py
        run: python -m build

      - name: Verify the artifact before publishing
        working-directory: src/py
        run: |
          twine check dist/*
          # Fails the run rather than publishing a platform-specific wheel:
          # this package has no compiled extension, so the only correct
          # wheel tag is py3-none-any.
          ls dist/*-py3-none-any.whl

      - name: Publish to PyPI
        working-directory: src/py
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/*

      - name: Commit the version bump
        run: |
          # Only pyproject.toml moves. dist/ is build output, not tracked.
          git add src/py/pyproject.toml
          git commit -m "chore: release python v${{ steps.bump.outputs.version }}"
          git tag "python-v${{ steps.bump.outputs.version }}"
          git push
          git push --tags
