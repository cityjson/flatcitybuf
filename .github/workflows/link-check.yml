name: link-check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --offline checks only internal/relative links, so a moved or deleted
      # file fails loudly while external URLs never make the build flaky.
      #
      # src/rust/fcb_api/src/openapi is openapi-generator output; its README
      # links to a docs/ tree the generator emits but we do not commit.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline
            --no-progress
            --exclude-path docs/superpowers
            --exclude-path .claude
            --exclude-path .superpowers
            --exclude-path node_modules
            --exclude-path target
            --exclude-path src/rust/fcb_api/src/openapi
            './**/*.md'
          fail: true
