name: API documentation

# Builds the API reference for all four implementations and publishes them as
# one site on GitHub Pages:
#
#   /            landing page
#   /rust/       rustdoc      (cargo doc)          -- also on docs.rs
#   /cpp/        doxygen
#   /python/     pdoc
#   /typescript/ typedoc
#
# Each language owns its own generator behind the same `just docs` verb, so
# this workflow never encodes a per-language command -- only where the output
# lands.
#
# The examples/web demo is NOT built here: it deploys separately to Cloudflare
# Workers (see deploy-web-demo.yml). A repo has exactly one Pages deployment
# target, so it never shared this one.
#
# Called by release.yml (which passes release_tag, so the site is also
# attached to the release as a tarball), and runnable on its own.

on:
  workflow_call:
    inputs:
      release_tag:
        description: "Attach the built docs to this release tag"
        required: false
        type: string
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/*/src/**"
      - "src/cpp/include/**"
      - "src/cpp/Doxyfile"
      - "src/ts/typedoc.json"
      - ".github/workflows/docs.yml"

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install just task runner
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: just

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src/rust
          shared-key: "fcb-docs"

      - name: Install doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"

      # One verb, every language. examples/web is a no-op (an application, not
      # a documented package).
      - name: just docs
        run: just docs

      # Output locations are per-generator and are NOT unified by the
      # justfiles, so they are mapped here -- the one place that needs to know.
      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p site
          cp -r src/rust/target/doc  site/rust
          cp -r src/cpp/docs/html    site/cpp
          cp -r src/py/docs/api      site/python
          cp -r src/ts/docs          site/typescript

          # rustdoc emits no root index.html when several crates are built, so
          # point at the crate a visitor actually wants.
          cat > site/rust/index.html <<'HTML'
          <!doctype html><meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=fcb_core/index.html">
          <a href="fcb_core/index.html">fcb_core</a>
          HTML

          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>FlatCityBuf — API documentation</title>
            <style>
              :root { color-scheme: light dark; }
              body { font: 16px/1.6 system-ui, sans-serif; max-width: 46rem;
                     margin: 4rem auto; padding: 0 1.25rem; }
              h1 { font-size: 1.6rem; margin-bottom: .25rem; }
              p.lede { opacity: .75; margin-top: 0; }
              ul { list-style: none; padding: 0; }
              li { margin: .75rem 0; padding: .9rem 1rem; border: 1px solid;
                   border-color: color-mix(in srgb, currentColor 20%, transparent);
                   border-radius: .5rem; }
              a { text-decoration: none; font-weight: 600; }
              a:hover { text-decoration: underline; }
              small { display: block; opacity: .7; font-weight: 400; }
            </style>
          </head>
          <body>
            <h1>FlatCityBuf — API documentation</h1>
            <p class="lede">A cloud-optimized binary format for 3D city models:
               CityJSON in FlatBuffers, with a packed Hilbert R-tree, a static
               B+tree attribute index, and HTTP range reads.</p>
            <ul>
              <li><a href="rust/">Rust — fcb_core</a>
                  <small>Reader and writer. The reference implementation, and the
                  oracle the other three are validated against. Also on docs.rs.</small></li>
              <li><a href="cpp/">C++ — flatcitybuf</a>
                  <small>Native C++17 reader. No FFI, no async runtime.</small></li>
              <li><a href="python/">Python — flatcitybuf</a>
                  <small>Pure-Python reader. No compiled dependency.</small></li>
              <li><a href="typescript/">TypeScript — @cityjson/flatcitybuf</a>
                  <small>Pure TypeScript reader. Runs in Node and the browser.</small></li>
            </ul>
          </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Attach docs tarball to the release
        if: inputs.release_tag != ''
        run: tar -czf flatcitybuf-docs.tar.gz -C site .

      # A single tarball, not the several hundred individual .html files the
      # previous release workflow uploaded one by one.
      - name: Upload docs tarball
        if: inputs.release_tag != ''
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: flatcitybuf-docs.tar.gz
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
