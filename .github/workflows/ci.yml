name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/rust/**"
      - "src/cpp/**"
      - ".github/workflows/ci.yml"

  pull_request:
    branches: [main]
    paths:
      - "src/rust/**"
      - "src/cpp/**"
      - ".github/workflows/ci.yml"

env:
  CARGO_TERM_COLOR: always
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/rust

    steps:
      - uses: actions/checkout@v4

      - name: Install just task runner
        uses: taiki-e/install-action@just

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/rust
          shared-key: "fcb-rust-ci"

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Check Rust crates
        run: just check-common

  check-python:
    name: Check Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/rust

    steps:
      - uses: actions/checkout@v4

      - name: Install just task runner
        uses: taiki-e/install-action@just

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/rust
          shared-key: "fcb-python-ci"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Check Python package
        run: just check-py

  check-cpp:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libflatbuffers-dev nlohmann-json3-dev \
                                  doctest-dev libcurl4-openssl-dev
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install flatbuffers nlohmann-json doctest
      - name: Configure
        working-directory: src/cpp
        run: cmake -B build -S . -DFCB_BUILD_TESTS=ON -DFCB_WITH_CURL=ON
      - name: Build
        working-directory: src/cpp
        run: cmake --build build
      - name: Test
        working-directory: src/cpp
        run: ctest --test-dir build --output-on-failure
      - name: Default build must not link curl or TLS
        working-directory: src/cpp
        run: |
          cmake -B build-default -S . -DFCB_BUILD_TESTS=OFF -DFCB_BUILD_EXAMPLES=OFF
          cmake --build build-default
          if nm -u build-default/libfcb_core_cpp.a 2>/dev/null \
               | grep -iE 'curl|ssl_|crypto'; then
            echo "curl/TLS symbols leaked into the default build" >&2
            exit 1
          fi
          echo "clean: no curl/TLS symbols"
      - name: Sanitizers
        working-directory: src/cpp
        run: |
          cmake -B build-asan -S . -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build-asan
          ctest --test-dir build-asan --output-on-failure
