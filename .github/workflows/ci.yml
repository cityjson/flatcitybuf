name: CI (Rust + C++)

# Rust and C++ live together here because they share the conformance corpus:
# the Rust reader PRODUCES conformance/*.expected.jsonl and the C++ reader is
# checked against it, so a corpus change must re-run both.
#
# Python and TypeScript have their own workflows (ci-python.yml, ci-ts.yml).

on:
  push:
    branches: [main, develop]
    paths:
      - "src/rust/**"
      - "src/cpp/**"
      - "conformance/**"
      - "justfile"
      - ".github/workflows/ci.yml"

  pull_request:
    branches: [main, develop]
    paths:
      - "src/rust/**"
      - "src/cpp/**"
      - "conformance/**"
      - "justfile"
      - ".github/workflows/ci.yml"

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/rust

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install just task runner
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: just

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src/rust
          shared-key: "fcb-rust-ci"

      - name: Install nextest
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: nextest

      # lint + type + test + build. Read-only: `just fix` is the only recipe
      # that rewrites source, and it is never called here.
      - name: just check
        run: just check

  cpp:
    name: C++ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: src/cpp

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install just task runner
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: just

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake nlohmann-json3-dev \
                                  doctest-dev libcurl4-openssl-dev

      # clang-format is not on the macos-latest image; `just lint` needs it.
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install clang-format nlohmann-json doctest

      # The committed generated headers static_assert the EXACT flatbuffers
      # runtime version (25.9.23). Ubuntu's libflatbuffers-dev is 23.5.26 and
      # ships no CMake config at all, and brew's formula floats with time, so
      # build the pinned version from source on both platforms (~1 min).
      - name: Install flatbuffers 25.9.23
        run: |
          git init "$RUNNER_TEMP/flatbuffers"
          git -C "$RUNNER_TEMP/flatbuffers" fetch --depth 1 \
            https://github.com/google/flatbuffers.git \
            187240970746d00bbd26b0f5873ed54d2477f9f3  # v25.9.23
          git -C "$RUNNER_TEMP/flatbuffers" checkout FETCH_HEAD
          cmake -S "$RUNNER_TEMP/flatbuffers" -B "$RUNNER_TEMP/flatbuffers/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DFLATBUFFERS_BUILD_TESTS=OFF -DFLATBUFFERS_BUILD_FLATC=OFF
          cmake --build "$RUNNER_TEMP/flatbuffers/build" -j 4
          sudo cmake --install "$RUNNER_TEMP/flatbuffers/build"

      # lint (clang-format --dry-run --Werror) + build + test + test-http.
      #
      # test-http matters specifically: the HTTP adapter builds into its own
      # tree, and its tests SKIP unless FCB_TEST_HTTP_URL is set -- which only
      # `just test-http` does, by starting the range-capable server. Before
      # this ran in CI every HTTP test silently skipped, which is how a stale
      # hardcoded fixture size survived in test_http.cpp.
      - name: just check
        run: just check

      # Separate from `check` because it is slow: the default build must link
      # neither curl nor a TLS stack, and the suite must be clean under
      # ASan/UBSan.
      - name: Hardening (no curl/TLS symbols, ASan/UBSan)
        run: just harden
