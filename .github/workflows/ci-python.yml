name: CI (Python)

on:
  push:
    branches: [main, develop]
    paths:
      - "src/py/**"
      - "conformance/**"
      - ".github/workflows/ci-python.yml"

  pull_request:
    branches: [main, develop]
    paths:
      - "src/py/**"
      - "conformance/**"
      - ".github/workflows/ci-python.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pure-Python package at src/py: no compiled dependency, no Rust toolchain.
  check:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    defaults:
      run:
        working-directory: src/py

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install just task runner
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: just

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      # `just check` runs ruff, mypy --strict and pytest, then re-runs mypy +
      # pytest a second time with numpy UNINSTALLED (the `test-no-numpy`
      # recipe). numpy is a genuine optional extra -- every code path has a
      # working pure-Python fallback -- so both states must be exercised, or
      # whichever one happens to be installed is the only one ever tested.
      # Expect `255 passed` on the numpy pass and `251 passed, 4 skipped` on
      # the numpy-less one, where the parity tests importorskip cleanly.
      - name: just check
        run: just check
