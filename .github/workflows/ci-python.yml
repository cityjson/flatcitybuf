name: Python CI

on:
  push:
    branches: [main]
    paths:
      - "src/py/**"
      - "conformance/**"
      - ".github/workflows/ci-python.yml"

  pull_request:
    branches: [main]
    paths:
      - "src/py/**"
      - "conformance/**"
      - ".github/workflows/ci-python.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pure-Python package at src/py: no compiled dependency, no Rust toolchain.
  test-py-native:
    name: Test pure-Python package (src/py)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    defaults:
      run:
        working-directory: src/py

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      # numpy is a genuine optional extra (never imported at module
      # scope -- see flatcitybuf/cityjson.py's/feature.py's
      # `_import_numpy`), and both the "numpy absent" and "numpy
      # installed" code paths must actually be verified in CI, not just
      # whichever one happens to be installed. `uv sync --extra dev`
      # here matches it exactly, so the first pass below is genuinely
      # numpy-less: the pure-Python fallback runs, and the
      # numpy-parity tests (test_cityjson.py) skip cleanly via
      # `pytest.importorskip("numpy")`.
      - name: Install dev dependencies (no numpy)
        run: uv sync --extra dev

      - name: Run tests (no numpy)
        run: uv run pytest -v

      - name: Run linter
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run mypy (no numpy)
        run: uv run mypy

      # Second pass: numpy installed, so the bulk-decode path actually
      # runs (rather than skipping) and the numpy-parity tests assert
      # the two paths agree.
      - name: Install numpy extra
        run: uv sync --extra dev --extra numpy

      - name: Run tests (with numpy)
        run: uv run pytest -v

      - name: Run mypy (with numpy)
        run: uv run mypy
