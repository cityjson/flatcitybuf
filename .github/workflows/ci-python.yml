name: CI (Python)

on:
  push:
    branches: [main, develop]
    paths:
      - "src/py/**"
      - "conformance/**"
      - ".github/workflows/ci-python.yml"

  pull_request:
    branches: [main, develop]
    paths:
      - "src/py/**"
      - "conformance/**"
      - ".github/workflows/ci-python.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pure-Python package at src/py: no compiled dependency, no Rust toolchain.
  check:
    name: Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # setup-python has no Python 3.9 build for Ubuntu 26.04, which is
        # what ubuntu-latest resolves to, so the 3.9 job stays on 24.04.
        include:
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.12"
            os: ubuntu-latest
    defaults:
      run:
        working-directory: src/py

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install just task runner
        uses: taiki-e/install-action@v2.90.6
        with:
          tool: just

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0

      # `just check` runs ruff, mypy --strict and pytest, then re-runs mypy +
      # pytest a second time with numpy UNINSTALLED (the `test-no-numpy`
      # recipe). numpy is a genuine optional extra -- every code path has a
      # working pure-Python fallback -- so both states must be exercised, or
      # whichever one happens to be installed is the only one ever tested.
      # Expect `255 passed` on the numpy pass and `251 passed, 4 skipped` on
      # the numpy-less one, where the parity tests importorskip cleanly.
      - name: just check
        run: just check
