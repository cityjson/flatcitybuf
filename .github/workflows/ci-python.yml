name: Python CI

on:
  push:
    branches: [main]
    paths:
      - "src/rust/fcb_py/**"
      - ".github/workflows/**"

  pull_request:
    branches: [main]
    paths:
      - "src/rust/fcb_py/**"
      - ".github/workflows/**"

env:
  CARGO_TERM_COLOR: always
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # First, check if Rust code compiles
  check-rust:
    name: Check Rust Compilation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/rust

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/rust

      - name: Check formatting
        run: cargo fmt --all -- --check

      # - name: Run clippy
      #   run: cargo clippy --all-targets --all-features

      - name: Check compilation
        run: |
          cd fcb_py
          cargo check --release --features pyo3/extension-module

      - name: Build with verbose output (if check fails)
        if: failure()
        run: |
          cd fcb_py
          cargo build --release --features pyo3/extension-module --verbose 2>&1 | tee build.log
          echo "=== Last 100 lines of errors ==="
          tail -100 build.log

  test:
    name: Test Python Package
    needs: check-rust # Only run if Rust compilation succeeds
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # Continue testing other combinations if one fails
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11"]
        exclude:
          # Skip some combinations to reduce CI time
          - os: macos-latest
            python-version: "3.8"
          - os: macos-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.8"
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.10"

    defaults:
      run:
        working-directory: src/rust

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/rust
          shared-key: "fcb-python-ci-${{ matrix.os }}-${{ matrix.python-version }}"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dev dependencies and build
        run: |
          cd fcb_py
          uv sync --extra dev
          uv run maturin develop --release

      - name: Run linting
        run: |
          cd fcb_py
          uv run ruff check .
          uv run ruff format --check .

      - name: Run tests
        run: |
          cd fcb_py
          uv run pytest tests/ -v --tb=short

  build-wheels:
    name: Build wheels
    needs: check-rust # Only build wheels if Rust compilation succeeds
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        working-directory: src/rust/fcb_py

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist --find-interpreter
          sccache: "true"
          manylinux: auto
          working-directory: src/rust/fcb_py
          before-script-linux: |
            # Install OpenSSL development packages inside maturin container
            echo "=== Container Information ==="
            cat /etc/os-release || echo "No /etc/os-release found"
            echo "Available package managers:"
            command -v yum && echo "  yum: $(yum --version | head -1)" || echo "  yum: not found"
            command -v apt-get && echo "  apt-get: $(apt-get --version | head -1)" || echo "  apt-get: not found"
            command -v apk && echo "  apk: $(apk --version | head -1)" || echo "  apk: not found"
            
            echo "=== Installing OpenSSL development packages ==="
            if command -v yum >/dev/null 2>&1; then
              echo "Using yum (CentOS/RHEL based)"
              yum update -y || echo "yum update failed, continuing..."
              yum install -y openssl-devel pkg-config || (echo "yum install failed" && exit 1)
            elif command -v apt-get >/dev/null 2>&1; then
              echo "Using apt-get (Debian/Ubuntu based)"
              apt-get update || echo "apt-get update failed, continuing..."
              apt-get install -y libssl-dev pkg-config || (echo "apt-get install failed" && exit 1)
            elif command -v apk >/dev/null 2>&1; then
              echo "Using apk (Alpine based)"
              apk update || echo "apk update failed, continuing..."
              apk add openssl-dev pkgconfig || (echo "apk add failed" && exit 1)
            else
              echo "ERROR: No supported package manager found"
              exit 1
            fi
            
            echo "=== Verifying OpenSSL installation ==="
            pkg-config --exists openssl && echo "✓ OpenSSL found via pkg-config" || echo "✗ OpenSSL not found via pkg-config"
            pkg-config --modversion openssl || echo "Could not get OpenSSL version"
            ls -la /usr/lib*/pkgconfig/*ssl* || echo "No OpenSSL pkgconfig files found"

      - name: Check wheel contents
        shell: bash
        run: |
          pip install wheel
          wheel unpack dist/*.whl || true
          ls -la dist/

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ github.run_number }}
          path: src/rust/fcb_py/dist

  build-sdist:
    name: Build source distribution
    needs: check-rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/rust/fcb_py

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: src/rust/fcb_py

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist-${{ github.run_number }}
          path: src/rust/fcb_py/dist

  # Optional: Test the built wheels
  test-wheels:
    name: Test built wheels
    needs: [build-wheels]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Test wheel installation
        run: |
          pip install dist/*cp311*linux*.whl
          python -c "import flatcitybuf; print(flatcitybuf.__version__)"
