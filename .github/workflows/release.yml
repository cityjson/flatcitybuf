name: Create Release

# Tags `v<fcb_core version>`, creates the GitHub release, attaches prebuilt C++
# static libraries + headers for each platform, and publishes the API docs.
#
# NOTE ON VERSIONING: the four packages version independently --
#   src/rust/fcb_core/Cargo.toml   (crates.io; also the tag this workflow cuts)
#   src/ts/package.json            (npm,  tagged npm-v*    by publish-npm.yml)
#   src/py/pyproject.toml          (PyPI, tagged python-v* by publish-python.yml)
#   src/cpp/CMakeLists.txt         (C++,  no independent tag)
# so `v0.7.6` names the Rust version only. Do not read it as a repo-wide
# version.

on:
  workflow_dispatch:

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract_version.outputs.VERSION }}
      tag_exists: ${{ steps.check_tag.outputs.TAG_EXISTS }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GA_TOKEN }}

      - name: Extract version from Cargo.toml
        id: extract_version
        run: |
          VERSION=$(grep "^version" src/rust/fcb_core/Cargo.toml | head -1 | cut -d'"' -f2)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Check if tag exists
        id: check_tag
        run: |
          # Anchored: without the trailing $, v0.7.6 also matched v0.7.60.
          if git ls-remote --tags origin | grep -q "refs/tags/v${{ steps.extract_version.outputs.VERSION }}$"; then
            echo "TAG_EXISTS=true" >> $GITHUB_OUTPUT
          else
            echo "TAG_EXISTS=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate release notes
        if: steps.check_tag.outputs.TAG_EXISTS == 'false'
        id: release_notes
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          {
            echo "RELEASE_NOTES<<FCBEOF"
            echo "## What's Changed"
            echo ""
            if [ -z "$LATEST_TAG" ]; then
              echo "Initial release"
            else
              git log "$LATEST_TAG"..HEAD --pretty=format:"- %s"
            fi
            echo ""
            echo ""
            echo "### Package versions in this commit"
            echo ""
            echo "| Package | Registry | Version |"
            echo "|---|---|---|"
            echo "| fcb_core / fcb_cli | crates.io | ${{ steps.extract_version.outputs.VERSION }} |"
            echo "| @cityjson/flatcitybuf | npm | $(grep -m1 '"version"' src/ts/package.json | cut -d'"' -f4) |"
            echo "| flatcitybuf | PyPI | $(grep -m1 '^version' src/py/pyproject.toml | cut -d'"' -f2) |"
            echo "| flatcitybuf (C++) | GitHub release | $(grep -m1 'project(flatcitybuf VERSION' src/cpp/CMakeLists.txt | sed 's/.*VERSION \([0-9.]*\).*/\1/') |"
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${LATEST_TAG}...v${{ steps.extract_version.outputs.VERSION }}"
            echo "FCBEOF"
          } >> $GITHUB_OUTPUT

      - name: Create and push tag
        if: steps.check_tag.outputs.TAG_EXISTS == 'false'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git tag -a "v${{ steps.extract_version.outputs.VERSION }}" -m "Release v${{ steps.extract_version.outputs.VERSION }}"
          git push origin "v${{ steps.extract_version.outputs.VERSION }}"

      # actions/create-release@v1 was archived by GitHub and is unmaintained;
      # softprops/action-gh-release is the maintained replacement, and is
      # already what uploads the assets below.
      - name: Create GitHub Release
        if: steps.check_tag.outputs.TAG_EXISTS == 'false'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ steps.extract_version.outputs.VERSION }}
          name: v${{ steps.extract_version.outputs.VERSION }}
          body: ${{ steps.release_notes.outputs.RELEASE_NOTES }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GA_TOKEN }}

  build-cpp:
    name: C++ ${{ matrix.artifact_name }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: flatcitybuf-cpp-linux-x86_64
          - os: ubuntu-24.04-arm
            artifact_name: flatcitybuf-cpp-linux-aarch64
          # macos-13 is the last x86_64 image; macos-14 and newer (including
          # macos-latest) are Apple Silicon. The previous matrix labelled a
          # macos-15 build "x86_64", so that artifact was arm64 under an
          # x86_64 name and no genuine x86_64 macOS build existed.
          - os: macos-13
            artifact_name: flatcitybuf-cpp-macos-x86_64
          - os: macos-latest
            artifact_name: flatcitybuf-cpp-macos-aarch64
          - os: windows-latest
            artifact_name: flatcitybuf-cpp-windows-x86_64
          - os: windows-11-arm
            artifact_name: flatcitybuf-cpp-windows-aarch64
          # The musl row was dropped: it set CMAKE_C_COMPILER=musl-gcc for a
          # C++ project (musl-tools ships no C++ driver), and a static .a does
          # not carry a libc the way an executable does, so it had no consumer.

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # nlohmann-json comes from the platform package manager where one
      # exists; flatbuffers deliberately does NOT (see the pinned source
      # build below).
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake nlohmann-json3-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install nlohmann-json

      # Header-only, so a source install is quick. vcpkg is not used here on
      # purpose: manifest mode reads src/cpp/vcpkg.json, which would drag in
      # whatever flatbuffers version the port currently floats at.
      - name: Install nlohmann-json (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          TMP="$(echo "$RUNNER_TEMP" | tr '\\' '/')"
          git init "$TMP/nlohmann-json"
          git -C "$TMP/nlohmann-json" fetch --depth 1 \
            https://github.com/nlohmann/json.git \
            55f93686c01528224f448c19128836e7df245f72  # v3.12.0
          git -C "$TMP/nlohmann-json" checkout FETCH_HEAD
          cmake -S "$TMP/nlohmann-json" -B "$TMP/nlohmann-json/build" \
            -DCMAKE_BUILD_TYPE=Release -DJSON_BuildTests=OFF
          cmake --build "$TMP/nlohmann-json/build" --config Release
          cmake --install "$TMP/nlohmann-json/build" --config Release \
            --prefix "$TMP/deps"

      # The committed generated headers static_assert the EXACT flatbuffers
      # runtime version (25.9.23). Ubuntu's libflatbuffers-dev is 23.5.26 and
      # ships no CMake config at all, and both brew's formula and vcpkg's port
      # float with time (25.12.x trips the assert) -- so build the pinned
      # version from source on every platform, exactly as ci.yml does.
      # Installing to a prefix needs no elevation on any runner; --config
      # Release is required by the multi-config VS generator on Windows and is
      # ignored by the single-config generators elsewhere.
      - name: Install flatbuffers 25.9.23
        shell: bash
        run: |
          TMP="$(echo "$RUNNER_TEMP" | tr '\\' '/')"
          echo "DEPS_PREFIX=$TMP/deps" >> "$GITHUB_ENV"
          git init "$TMP/flatbuffers"
          git -C "$TMP/flatbuffers" fetch --depth 1 \
            https://github.com/google/flatbuffers.git \
            187240970746d00bbd26b0f5873ed54d2477f9f3  # v25.9.23
          git -C "$TMP/flatbuffers" checkout FETCH_HEAD
          cmake -S "$TMP/flatbuffers" -B "$TMP/flatbuffers/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DFLATBUFFERS_BUILD_TESTS=OFF -DFLATBUFFERS_BUILD_FLATC=OFF
          cmake --build "$TMP/flatbuffers/build" --config Release -j 4
          cmake --install "$TMP/flatbuffers/build" --config Release \
            --prefix "$TMP/deps"

      # Tests and examples are OFF: both default to ON, and FCB_BUILD_TESTS=ON
      # additionally requires doctest, which is not installed here -- another
      # reason the previous release build could not configure. Correctness is
      # gated by ci.yml, not by the release artifacts.
      - name: Configure
        shell: bash
        working-directory: src/cpp
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DFCB_BUILD_TESTS=OFF -DFCB_BUILD_EXAMPLES=OFF \
            -DCMAKE_PREFIX_PATH="$DEPS_PREFIX"

      - name: Build
        shell: bash
        working-directory: src/cpp
        run: cmake --build build --config Release

      - name: Package
        shell: bash
        run: |
          mkdir -p release-artifacts/lib release-artifacts/include
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp src/cpp/build/Release/fcb_core_cpp.lib release-artifacts/lib/
          else
            cp src/cpp/build/libfcb_core_cpp.a release-artifacts/lib/
          fi
          cp -r src/cpp/include/. release-artifacts/include/
          cp src/cpp/README.md src/cpp/INSTALL.md LICENSE release-artifacts/
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a -tzip ${{ matrix.artifact_name }}.zip ./release-artifacts/*
          else
            tar -czf ${{ matrix.artifact_name }}.tar.gz -C release-artifacts .
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.*
          retention-days: 90

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: ${{ matrix.artifact_name }}.*
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GA_TOKEN }}

  # API documentation for all four languages, published to GitHub Pages and
  # attached to the release as a single tarball. Previously this job ran
  # Doxygen only, and uploaded every generated .html file as an individual
  # release asset.
  docs:
    name: API documentation
    needs: create-release
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      release_tag: v${{ needs.create-release.outputs.version }}
    secrets: inherit
