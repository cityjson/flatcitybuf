[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flatcitybuf"
version = "0.3.0"
description = "Pure-Python reader for FlatCityBuf, a cloud-optimized binary format for 3D city models"
requires-python = ">=3.9"
dependencies = ["flatbuffers>=24.3.25"]

[project.optional-dependencies]
numpy = ["numpy>=1.21"]
http = ["httpx>=0.27"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.12", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["flatcitybuf"]

[tool.mypy]
strict = true
files = ["flatcitybuf", "tests"]

# flatc-generated code is machine output: it never satisfies mypy strict
# (untyped defs, untyped calls, etc). `exclude` alone would not be enough,
# because excluded modules are still analyzed when a typed module imports
# from them; `ignore_errors` on the module itself silences that while still
# letting hand-written modules import names from it normally.
[[tool.mypy.overrides]]
module = "flatcitybuf.generated.*"
ignore_errors = true

[tool.ruff]
line-length = 79
target-version = "py39"
# Machine-generated FlatBuffers bindings; not subject to our lint rules.
extend-exclude = ["flatcitybuf/generated"]

[tool.ruff.lint]
# Default select (E4, E7, E9, F) doesn't include E501 (line-too-long), so
# line-length above would otherwise be enforced by nothing.
extend-select = ["E501"]
