[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "flatcitybuf"
version = "0.1.0"
description = "Python bindings for FlatCityBuf - a cloud-optimized binary format for 3D city models"
authors = [{ name = "HideBa", email = "baba.papa1120.ba@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
homepage = "https://github.com/cityjson/flatcitybuf"
repository = "https://github.com/cityjson/flatcitybuf"
documentation = "https://github.com/cityjson/flatcitybuf/blob/main/README.md"
requires-python = ">=3.8.1"
keywords = ["gis", "3d", "cityjson", "citymodel", "flatbuffers"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
]
dependencies = ["pytest>=8.3.5", "pytest-asyncio>=0.24.0"]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-asyncio>=0.21.0"]
dev = ["black>=23.0", "mypy>=1.0", "flake8>=6.0", "isort>=5.0", "maturin>=1.0"]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "flatcitybuf"


[tool.black]
line-length = 78
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''


[tool.mypy]
files = ["python/**/*.py", "tests/**/*.py"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_calls = true
disallow_subclassing_any = true
no_implicit_optional = true
warn_redundant_casts = true
warn_untyped_decorators = true
warn_unused_ignores = true
strict_optional = true
strict_param_types = true
warn_untyped_fields = true

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["python", "python.*"]

# Additional metadata for PyPI publishing
[project.urls]
"Bug Tracker" = "https://github.com/cityjson/flatcitybuf/issues"
"Source Code" = "https://github.com/cityjson/flatcitybuf"
"Documentation" = "https://github.com/cityjson/flatcitybuf/blob/main/README.md"
