[package]
name = "fcb_citygml"
version = "0.1.0"
edition = "2021"
authors = ["Hidemichi Baba <baba.papa1120.ba@gmail.com>"]
license = "MIT"
repository = "https://github.com/cityjson/flatcitybuf"
description = "CityGML 2.0 to CityJSON(Seq) converter used by the FlatCityBuf CLI"
keywords = ["citygml", "cityjson", "gml", "geospatial", "3d"]
categories = ["encoding", "parser-implementations", "science::geo"]

[dependencies]
quick-xml = { workspace = true }
cjseq = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
