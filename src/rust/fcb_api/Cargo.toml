[package]
name = "fcb_api"
version = "0.9.0"
edition = "2021"
authors = ["Hidemichi Baba <baba.papa1120.ba@gmail.com>"]
license = "MIT"
repository = "https://github.com/cityjson/flatcitybuf"
description = "An OGC API - Features server over a FlatCityBuf dataset, read from a local file or over HTTP range requests."
readme = "README.md"
keywords = ["cityjson", "flatcitybuf", "ogc-api", "geospatial", "3d"]
categories = ["web-programming::http-server", "science::geo"]
# The 3DBAG OpenAPI document and the scripts that regenerate
# src/openapi/models from it are development inputs, not part of the crate.
exclude = [
  "schema/",
  "fetch_schema.sh",
  "generate_models.sh",
  "openapitools.json",
  "Makefile",
]

[lib]
name = "fcb_api"
path = "src/lib.rs"

[[bin]]
name = "fcb_api"
path = "src/main.rs"

[dependencies]
fcb_core = { workspace = true, features = ["http"] }
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
env_logger = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
futures = { workspace = true }
bytes = { workspace = true }
http-range-client = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
ordered-float = { workspace = true }
cjseq = { workspace = true }
thiserror = { workspace = true }
proj4rs = { workspace = true }
crs-definitions = { workspace = true }

[dev-dependencies]
urlencoding = { workspace = true }
tempfile = { workspace = true }
